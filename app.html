<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NTStudyPDf</title>
<meta name="theme-color" content="#0b2a6f">
<style>
:root{--b:#1a56db;--d:#0b2a6f;--l:#eef4ff;--t:#0f1b3d;--m:#5b6b8c}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--l);color:var(--t)}
header{background:linear-gradient(135deg,var(--d),var(--b));color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{margin:0;font-size:20px}
main{max-width:560px;margin:0 auto;padding:12px 16px 40px}
.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #1a56db22}
h2{margin:0 0 8px}
button{background:var(--b);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:600}
button.s{background:#fff;color:var(--b);border:1.5px solid var(--b)}
button.r{background:#d92d20}
button:disabled{opacity:.5}
input{width:100%;padding:12px;border:1.5px solid #c7d6f5;border-radius:10px;font-size:16px;margin:8px 0}
.msg{color:#d92d20;font-size:14px;min-height:18px;margin:6px 0}
.ok{color:#067647}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sub{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sub h3{margin:0 0 2px;font-size:17px}
.sub p{margin:0 0 6px;color:var(--m);font-size:13px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--l);color:var(--b)}
.hide{display:none}
#pages canvas{width:100%;display:block;margin:8px 0;background:#fff;border-radius:6px}
code{font-size:15px;font-weight:700;letter-spacing:1px;-webkit-user-select:text;user-select:text;word-break:break-all}
@media print{body{display:none}}
</style></head>
<body>
<header><h1>NTStudyPDf</h1><div class="row"><button class="s hide" id="adminBtn">Admin</button><button class="s hide" id="outBtn">Sign out</button></div></header>
<main>
<section id="vLogin" class="card"><h2>Welcome</h2><p>CBSE Class 10 sample papers: Maths, Science and English.</p><button id="loginBtn">Sign in with Google</button><p class="msg" id="m0"></p></section>

<section id="vCode" class="card hide"><h2>Activate your papers</h2><p>Enter the activation key you received.</p><input id="codeIn" placeholder="NT-XXXX-XXXX-XXXX" autocapitalize="characters" autocomplete="off"><button id="actBtn">Activate</button><p class="msg" id="m1"></p></section>

<section id="vHome" class="hide"><div id="list"></div></section>

<section id="vView" class="hide"><div class="row"><button class="s" id="backBtn">Back</button><b id="vTitle"></b></div><p class="msg" id="m2"></p><div id="pages"></div></section>

<section id="vAdmin" class="hide">
 <div class="row"><button class="s" id="exitAdmin">Back</button><b>Admin panel</b></div>
 <div class="card"><h2>New activation key</h2><input id="lbl" placeholder="Customer name or note (optional)"><button id="genBtn">Generate key</button><p>Latest key: <code id="newKey">-</code></p></div>
 <h2>Keys</h2><div id="codes"></div>
 <h2>PDF files</h2><div id="ups"></div>
</section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,collection,getDocs,query,orderBy,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyD4uOF677YOXxpRqzSqonzEJL_HBSv5hH0",
  authDomain:"studypdf-7f1b2.firebaseapp.com",
  projectId:"studypdf-7f1b2",
  storageBucket:"studypdf-7f1b2.firebasestorage.app",
  messagingSenderId:"847127212872",
  appId:"1:847127212872:web:8eb7fd511c4b1a1890797d"
});
const auth=getAuth(app),db=getFirestore(app);
const ADMIN="sohailakhtaransari456@gmail.com";
const SUBJ=[
 ["maths","📐 Mathematics","CBSE Class 10 Mathematics Sample Papers"],
 ["science","🔬 Science","CBSE Class 10 Science Sample Papers"],
 ["english","📖 English","CBSE Class 10 English Language & Literature Sample Papers"]];
const $=id=>document.getElementById(id);
const show=v=>["vLogin","vCode","vHome","vView","vAdmin"].forEach(x=>$(x).classList.toggle("hide",x!==v));
document.addEventListener("contextmenu",e=>e.preventDefault());
let me=null,isAdmin=false;

$("loginBtn").onclick=async()=>{
  $("m0").textContent="";
  try{await signInWithPopup(auth,new GoogleAuthProvider())}
  catch(e){$("m0").textContent="Sign-in failed ("+(e.code||e.message||"unknown")+"). Please try again."}
};
$("outBtn").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async u=>{
  me=u;isAdmin=!!u&&u.email===ADMIN&&u.emailVerified;
  $("outBtn").classList.toggle("hide",!u);
  $("adminBtn").classList.toggle("hide",!isAdmin);
  if(!u)return show("vLogin");
  await route();
});

async function myCode(){
  try{
    const us=await getDoc(doc(db,"users",me.uid));
    if(!us.exists())return null;
    const c=await getDoc(doc(db,"codes",us.data().code));
    if(c.exists()&&c.data().uid===me.uid&&c.data().status==="active")return c.data();
  }catch(e){}
  return null;
}
async function route(){
  if(isAdmin||await myCode())home();
  else{show("vCode");$("m1").textContent=""}
}

$("actBtn").onclick=async()=>{
  const m=$("m1");m.className="msg";m.textContent="";
  const k=$("codeIn").value.trim().toUpperCase();
  if(!k)return;
  $("actBtn").disabled=true;
  try{
    const r=doc(db,"codes",k),s=await getDoc(r);
    if(!s.exists())throw "Invalid activation key. Please check your key and try again.";
    const d=s.data();
    if(d.status==="revoked")throw "Your access has been revoked.";
    if(d.status==="unused")await updateDoc(r,{uid:me.uid,status:"active",email:me.email,activatedAt:serverTimestamp()});
    else if(d.uid!==me.uid)throw "This key is already activated on another device.";
    await setDoc(doc(db,"users",me.uid),{code:k});
    m.className="msg ok";m.textContent="Activation successful.";
    await route();
  }catch(e){m.textContent=typeof e==="string"?e:"Unable to verify access. Please try again."}
  $("actBtn").disabled=false;
};

async function home(){
  show("vHome");
  const L=$("list");L.innerHTML="";
  for(const [id,n,desc] of SUBJ){
    let meta=null;
    try{const s=await getDoc(doc(db,"pdfs",id));if(s.exists())meta=s.data()}catch(e){}
    const c=document.createElement("div");c.className="card sub";
    const t=document.createElement("div");
    t.innerHTML=`<h3></h3><p></p><span class="tag"></span>`;
    t.querySelector("h3").textContent=n;
    t.querySelector("p").textContent=desc;
    t.querySelector(".tag").textContent=meta?"Access active":"Coming soon";
    c.appendChild(t);
    if(meta){const b=document.createElement("button");b.textContent="Open PDF";b.onclick=()=>openPdf(id,n,meta);c.appendChild(b)}
    L.appendChild(c);
  }
}
$("backBtn").onclick=()=>home();

async function openPdf(id,n,meta){
  show("vView");$("vTitle").textContent=n;$("m2").textContent="";
  const P=$("pages");P.textContent="Loading…";
  try{
    let b64="";
    for(let i=0;i<meta.chunks;i++){
      const s=await getDoc(doc(db,"pdfs",id,"chunks",String(i)));
      b64+=s.data().d;
    }
    const bin=atob(b64),arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const pdf=await pdfjsLib.getDocument({data:arr}).promise;
    P.textContent="";
    const wm="Licensed Access — NTStudyPDf • ID "+me.uid.slice(0,6);
    for(let p=1;p<=pdf.numPages;p++){
      const pg=await pdf.getPage(p),v0=pg.getViewport({scale:1});
      const vp=pg.getViewport({scale:Math.min(innerWidth,560)*1.6/v0.width});
      const cv=document.createElement("canvas");cv.width=vp.width;cv.height=vp.height;
      P.appendChild(cv);
      const x=cv.getContext("2d");
      await pg.render({canvasContext:x,viewport:vp}).promise;
      x.save();x.globalAlpha=.15;x.fillStyle="#0b2a6f";
      x.font="bold "+(vp.width/24)+"px sans-serif";x.rotate(-.5);
      for(let yy=0;yy<vp.height*1.5;yy+=vp.height/6)
        for(let xx=-vp.width;xx<vp.width;xx+=vp.width*.95)x.fillText(wm,xx,yy);
      x.restore();
    }
  }catch(e){P.textContent="";$("m2").textContent="Unable to load this document. Please try again."}
}

// ---------- Admin ----------
$("adminBtn").onclick=()=>{show("vAdmin");loadCodes()};
$("exitAdmin").onclick=()=>home();
const AL="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function newKey(){
  const r=crypto.getRandomValues(new Uint8Array(12));let s="";
  r.forEach((v,i)=>{s+=AL[v%AL.length];if(i%4===3&&i<11)s+="-"});
  return "NT-"+s;
}
$("genBtn").onclick=async()=>{
  const k=newKey();
  try{
    await setDoc(doc(db,"codes",k),{status:"unused",uid:null,email:null,label:$("lbl").value.trim(),createdAt:serverTimestamp()});
    $("newKey").textContent=k;$("lbl").value="";loadCodes();
  }catch(e){$("newKey").textContent="Failed. Try again."}
};
async function loadCodes(){
  const q=await getDocs(query(collection(db,"codes"),orderBy("createdAt","desc")));
  const L=$("codes");L.innerHTML="";
  q.forEach(s=>{
    const d=s.data(),e=document.createElement("div");e.className="card";
    const c=document.createElement("code");c.textContent=s.id;
    const t=document.createElement("span");t.className="tag";t.textContent=" "+d.status;
    const p=document.createElement("p");p.textContent=[d.label,d.email].filter(Boolean).join(" | ");
    const row=document.createElement("div");row.className="row";
    const mk=(txt,cls,fn)=>{const b=document.createElement("button");b.textContent=txt;b.className=cls;b.onclick=async()=>{await fn();loadCodes()};row.appendChild(b)};
    mk("Revoke","r",()=>updateDoc(s.ref,{status:"revoked"}));
    mk("Reset device","s",()=>updateDoc(s.ref,{status:"unused",uid:null,email:null}));
    mk("Delete","s",()=>deleteDoc(s.ref));
    e.append(c,t,p,row);L.appendChild(e);
  });
}
async function wipe(id){
  const m=await getDoc(doc(db,"pdfs",id));
  if(m.exists())for(let i=0;i<m.data().chunks;i++)await deleteDoc(doc(db,"pdfs",id,"chunks",String(i)));
  await deleteDoc(doc(db,"pdfs",id));
}
SUBJ.forEach(([id,n])=>{
  const d=document.createElement("div");d.className="card";
  d.innerHTML=`<b></b><input type="file" accept="application/pdf"><div class="row"><button>Upload or replace</button><button class="s">Delete</button></div><p class="msg"></p>`;
  d.querySelector("b").textContent=n;
  const fi=d.querySelector("input"),[bu,bd]=d.querySelectorAll("button"),pm=d.querySelector(".msg");
  bu.onclick=async()=>{
    const f=fi.files[0];
    if(!f||f.type!=="application/pdf"){pm.className="msg";pm.textContent="Choose a PDF file first.";return}
    pm.className="msg";pm.textContent="Uploading…";
    try{
      const old=await getDoc(doc(db,"pdfs",id));
      const buf=new Uint8Array(await f.arrayBuffer()),CH=450000,n2=Math.ceil(buf.length/CH);
      for(let i=0;i<n2;i++){
        const part=buf.subarray(i*CH,(i+1)*CH);let s="";
        for(let j=0;j<part.length;j+=8192)s+=String.fromCharCode.apply(null,part.subarray(j,j+8192));
        await setDoc(doc(db,"pdfs",id,"chunks",String(i)),{d:btoa(s)});
        pm.textContent="Uploading "+(i+1)+" of "+n2;
      }
      await setDoc(doc(db,"pdfs",id),{chunks:n2,name:f.name,size:f.size,updatedAt:serverTimestamp()});
      if(old.exists())for(let i=n2;i<old.data().chunks;i++)await deleteDoc(doc(db,"pdfs",id,"chunks",String(i)));
      pm.className="msg ok";pm.textContent="Uploaded.";
    }catch(e){pm.className="msg";pm.textContent="Upload failed. Try again."}
  };
  bd.onclick=async()=>{
    try{await wipe(id);pm.className="msg ok";pm.textContent="Deleted."}
    catch(e){pm.className="msg";pm.textContent="Delete failed."}
  };
  $("ups").appendChild(d);
});
</script>
</body></html>
